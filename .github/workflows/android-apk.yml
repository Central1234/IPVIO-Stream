# Builds the Android APK (debug-signed, installable) on pushes to the fixes branch and on demand.
# Kept separate from build.yml (the maintainer's workflow) so that file stays unchanged.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ fixes ]
    paths-ignore:
      - "ios/**"
      - "windows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
        continue-on-error: true
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IPVIO-Stream-apk
          path: app/build/outputs/apk/debug/*.apk
