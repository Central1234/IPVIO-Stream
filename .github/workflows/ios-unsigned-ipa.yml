# Builds the iOS starter app (ios/) on a GitHub macOS runner and uploads an UNSIGNED .ipa as an artifact.
# Sign it yourself afterwards (Sideloadly, AltStore, ESign, or `codesign` with your own certificate).
# Run it from the Actions tab ("Run workflow"), or it runs on pushes that change ios/.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # iPhone Duo: only apps built with the iOS 27.1 SDK use the full inner display, so take the newest Xcode installed
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen

      - name: Build (no code signing)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project IPVIOStream.xcodeproj \
            -scheme IPVIOStream \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/IPVIOStream.app
          test -d "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry IPVIOStream-unsigned.ipa Payload
          ls -lh IPVIOStream-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: IPVIOStream-unsigned-ipa
          path: ios/IPVIOStream-unsigned.ipa

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
